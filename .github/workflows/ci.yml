name: CI

# Runs both test suites and the production build. Needs no secrets: every test uses a
# temporary database and a temporary .env, and nothing contacts an external service.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run pytest
        working-directory: backend
        run: pytest

  frontend:
    # Node 22, not 20: the test toolchain (Vitest 5, jsdom 31) declares Node >= 22.12 and
    # cannot start its workers on Node 20.
    name: Frontend · Vitest + build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest (once, no watch)
        run: npm test
      - name: Type-check and build
        run: npm run build

  frontend-node20:
    # `./village setup` only installs and builds the frontend, and that still works on Node 20
    # (the documented minimum). This job keeps that claim honest.
    name: Frontend · build only (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
